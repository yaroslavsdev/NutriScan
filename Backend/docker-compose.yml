services:
  # Backend
  app:
    build: .
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      - db
    restart: always

  # Postgres
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-nutriscan}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    restart: always

  # Caddy
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config: