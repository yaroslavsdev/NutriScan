name: CI

on: 
  push:
    branches: 
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-key
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r Backend/requirements.txt pytest httpx2
      - run: python -m pytest -v
        working-directory: Backend
      - run: docker build -t nutriscan ./Backend

  android-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NutriScanApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest --no-configuration-cache